<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Sprunki Babies 🍼</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap');

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

:root{
  --bg:#1a0a2e;
  --stage:#12072a;
  --tray:#fce4f0;
  --tray2:#f8c8e0;
  --beat-off:#2d1050;
  --pink:#ff6fa3;
  --glow:rgba(255,111,163,0.4);
}

body{
  background:var(--bg);
  font-family:'Baloo 2',cursive;
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  user-select:none;
}

/* ── HEADER ─────────────────────────────────── */
#hdr{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 16px 6px;
  flex-shrink:0;
}
#title{color:#fff;font-size:20px;font-weight:800;letter-spacing:.04em;}
#title span{color:var(--pink);}
#fire-meter{
  font-size:13px;font-weight:700;
  color:#ffcc00;
  background:rgba(255,200,0,.12);
  border:1.5px solid rgba(255,200,0,.3);
  border-radius:20px;
  padding:3px 12px;
  transition:all .3s;
  min-width:80px;text-align:center;
}

/* ── BEAT BAR ────────────────────────────────── */
#beat-bar{
  display:flex;
  justify-content:center;
  gap:5px;
  padding:6px 16px;
  flex-shrink:0;
}
.step{
  width:14px;height:14px;
  border-radius:50%;
  background:var(--beat-off);
  transition:background .05s, transform .05s;
  flex-shrink:0;
}
.step.quarter{border:1px solid #3d1a6a;}
.step.active{background:var(--pink);transform:scale(1.35);box-shadow:0 0 8px var(--glow);}
.step.accent{background:#c94070;}

/* ── STAGE ───────────────────────────────────── */
#stage{
  flex:1;
  background:var(--stage);
  margin:0 12px;
  border-radius:20px;
  position:relative;
  overflow:hidden;
  border:1.5px solid #2d1050;
  display:flex;
  align-items:center;
  justify-content:center;
}
/* spotlight */
#stage::before{
  content:'';
  position:absolute;
  inset:0;
  background:radial-gradient(ellipse 80% 60% at 50% 40%, rgba(120,60,200,.13) 0%, transparent 70%);
  pointer-events:none;
}
/* grid floor */
#stage::after{
  content:'';
  position:absolute;
  bottom:0;left:0;right:0;
  height:40%;
  background:repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0px, rgba(255,255,255,.03) 1px, transparent 1px, transparent 40px),
             repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0px, rgba(255,255,255,.03) 1px, transparent 1px, transparent 40px);
  pointer-events:none;
}
#hint{color:rgba(255,255,255,.18);font-size:15px;font-weight:500;letter-spacing:.06em;pointer-events:none;}
#active-zone{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:16px;
  padding:20px;
}

/* ── STAGE CHARACTER ─────────────────────────── */
.stage-char{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  cursor:pointer;
  animation:popIn .3s cubic-bezier(.34,1.56,.64,1) both;
  position:relative;
}
@keyframes popIn{
  from{opacity:0;transform:scale(0) translateY(20px);}
  to{opacity:1;transform:scale(1) translateY(0);}
}
.stage-char svg{
  filter:drop-shadow(0 4px 12px rgba(0,0,0,.4));
  transition:filter .1s;
}
.stage-char.playing svg{
  animation:beatBounce .13s ease;
}
@keyframes beatBounce{
  0%{transform:translateY(0) scale(1);}
  40%{transform:translateY(-10px) scale(1.08);}
  100%{transform:translateY(0) scale(1);}
}
.stage-char.glow svg{
  filter:drop-shadow(0 0 18px var(--char-glow,rgba(255,111,163,.8)));
}
.stage-name{
  color:rgba(255,255,255,.75);
  font-size:11px;font-weight:700;
  letter-spacing:.06em;
}
.remove-ring{
  position:absolute;
  top:-6px;right:-6px;
  width:20px;height:20px;
  background:#ff4466;
  border-radius:50%;
  color:white;font-size:12px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.4);
  line-height:1;
}

/* ── TRAY ────────────────────────────────────── */
#tray{
  background:var(--tray);
  border-top:3px solid #f8aacf;
  padding:10px 10px 14px;
  flex-shrink:0;
}
#tray-label{
  text-align:center;
  color:#c9558a;
  font-size:10px;font-weight:700;
  letter-spacing:.14em;
  margin-bottom:8px;
}
#char-row{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:nowrap;
  overflow-x:auto;
  padding:0 4px;
}
.tray-char{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  cursor:pointer;
  flex-shrink:0;
  transition:transform .15s;
}
.tray-char:active{transform:scale(.9);}
.tray-char.on svg{opacity:.45;filter:grayscale(0.5);}
.tray-char svg{
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.15));
}
.tray-label{
  font-size:10px;font-weight:700;
  color:#a0305a;
  letter-spacing:.04em;
}

/* ── SPARKLE ─────────────────────────────────── */
.spark{
  position:fixed;
  pointer-events:none;
  border-radius:50%;
  animation:sparkle .6s ease-out forwards;
}
@keyframes sparkle{
  0%{opacity:1;transform:translate(0,0) scale(1);}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0);}
}

/* ── FIRE TOAST ──────────────────────────────── */
#toast{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%) scale(0);
  background:#ff4488;
  color:white;
  padding:10px 28px;
  border-radius:30px;
  font-size:22px;font-weight:800;
  letter-spacing:.06em;
  pointer-events:none;
  z-index:99;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1), opacity .3s;
  opacity:0;
}
#toast.show{transform:translate(-50%,-50%) scale(1);opacity:1;}
</style>
</head>

      <!-- blush --><ellipse cx="21" cy="55" rx="8" ry="5" fill="#ce93d8" opacity=".55"/>
      <ellipse cx="59" cy="55" rx="8" ry="5" fill="#ce93d8" opacity=".55"/>
    </svg>`
  }
};

// ── AUDIO ENGINE ──────────────────────────────────────────────────────────────
let actx = null;
const masterVol = () => { const g = actx.createGain(); g.gain.value = 0.55; g.connect(actx.destination); return g; };

function initAudio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
}

function playKick() {
  const o = actx.createOscillator(), g = actx.createGain(), mv = masterVol();
  o.connect(g); g.connect(mv);
  o.frequency.setValueAtTime(180, actx.currentTime);
  o.frequency.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.28);
  g.gain.setValueAtTime(0.9, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.28);
  o.start(); o.stop(actx.currentTime + 0.28);
}

function playSnare() {
  const sz = actx.sampleRate * 0.18;
  const buf = actx.createBuffer(1, sz, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < sz; i++) d[i] = Math.random() * 2 - 1;
  const src = actx.createBufferSource();
  src.buffer = buf;
  const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1800; f.Q.value = 0.8;
  const g = actx.createGain(), mv = masterVol();
  g.gain.setValueAtTime(0.55, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.14);
  src.connect(f); f.connect(g); g.connect(mv);
  src.start(); src.stop(actx.currentTime + 0.14);
}

function playBell(freq) {
  const o = actx.createOscillator(), g = actx.createGain(), mv = masterVol();
  o.type = 'sine'; o.connect(g); g.connect(mv);
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.35, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.55);
  o.start(); o.stop(actx.currentTime + 0.55);
}

function playMusicBox(freq) {
  const o = actx.createOscillator(), g = actx.createGain(), mv = masterVol();
  o.type = 'triangle'; o.connect(g); g.connect(mv);
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.28, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.35);
  o.start(); o.stop(actx.currentTime + 0.35);
}

function playBass(freq) {
  const o = actx.createOscillator(), g = actx.createGain(), mv = masterVol();
  o.type = 'sawtooth'; o.connect(g); g.connect(mv);
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.4, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.45);
  o.start(); o.stop(actx.currentTime + 0.45);
}

function playPad(freq) {
  const o = actx.createOscillator(), g = actx.createGain(), mv = masterVol();
  o.type = 'sine'; o.connect(g); g.connect(mv);
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0, actx.currentTime);
  g.gain.linearRampToValueAtTime(0.22, actx.currentTime + 0.35);
  g.gain.linearRampToValueAtTime(0.0, actx.currentTime + 2.2);
  o.start(); o.stop(actx.currentTime + 2.2);
}

function triggerSound(id, step) {
  const c = CHARS[id];
  const ni = (step % (c.notes?.length || 1));
  switch (c.type) {
    case 'kick':  playKick(); break;
    case 'snare': playSnare(); break;
    case 'bell':  playBell(c.notes[ni]); break;
    case 'mbox':  playMusicBox(c.notes[ni]); break;
    case 'bass':  playBass(c.notes[ni]); break;
    case 'pad':   playPad(c.notes[ni]); break;
  }
}

// ── SEQUENCER ─────────────────────────────────────────────────────────────────
const BPM = 118;
const STEP_MS = (60000 / BPM) / 4;
let step = 0;
let seqTimer = null;
const activeSet = new Set();
const noteCounters = {};

function startSeq() {
  if (seqTimer) return;
  seqTimer = setInterval(tick, STEP_MS);
}

function stopSeq() {
  if (seqTimer) { clearInterval(seqTimer); seqTimer = null; }
  step = 0;
  updateBeatBar(-1);
}

function tick() {
  updateBeatBar(step);
  for (const id of activeSet) {
    const c = CHARS[id];
    if (c.pattern[step]) {
      noteCounters[id] = (noteCounters[id] || 0) + 1;
      triggerSound(id, noteCounters[id]);
      flashChar(id);
    }
  }
  step = (step + 1) % 16;
}

// ── BEAT BAR ──────────────────────────────────────────────────────────────────
const beatBar = document.getElementById('beat-bar');
const stepEls = [];
for (let i = 0; i < 16; i++) {
  const d = document.createElement('div');
  d.className = 'step' + (i % 4 === 0 ? ' quarter' : '');
  beatBar.appendChild(d);
  stepEls.push(d);
}

function updateBeatBar(s) {
  stepEls.forEach((el, i) => el.classList.toggle('active', i === s));
  if (s >= 0 && s % 4 === 0) stepEls[s].classList.add('accent');
}

// ── STAGE ─────────────────────────────────────────────────────────────────────
const hint = document.getElementById('hint');
const activeZone = document.getElementById('active-zone');
const fireMeter = document.getElementById('fire-meter');
const toast = document.getElementById('toast');

let toastTimer = null;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1400);
}

function updateFireMeter() {
  const n = activeSet.size;
  if (n === 0) { fireMeter.textContent = 'tap a baby!'; fireMeter.style.color = '#ffcc00'; return; }
  const labels = ['','🔥 warm','🔥🔥 hot!','🔥🔥🔥 fire!','⚡ FIRE BEAT!','🌟 LEGENDARY!!','💥 UNSTOPPABLE!!!'];
  fireMeter.textContent = labels[Math.min(n, labels.length - 1)];
  if (n >= 4) fireMeter.style.color = '#ff4466';
  else if (n >= 3) fireMeter.style.color = '#ff8800';
  else fireMeter.style.color = '#ffcc00';
  if (n === 3) showToast('🔥 FIRE BEAT!');
  if (n === 5) showToast('💥 LEGENDARY!');
}

function flashChar(id) {
  const el = document.getElementById('stage-' + id);
  if (!el) return;
  el.classList.remove('playing');
  void el.offsetWidth;
  el.classList.add('playing', 'glow');
  setTimeout(() => el.classList.remove('playing', 'glow'), 180);
}

function addToStage(id) {
  if (activeSet.has(id)) { removeFromStage(id); return; }
  if (activeSet.size >= 6) { showToast('stage is full! 🎵'); return; }
  activeSet.add(id);
  noteCounters[id] = 0;
  hint.style.display = 'none';

  const c = CHARS[id];
  const wrap = document.createElement('div');
  wrap.className = 'stage-char';
  wrap.id = 'stage-' + id;
  wrap.style.setProperty('--char-glow', c.glow);
  wrap.innerHTML = c.svg(72) + `<div class="stage-name">${c.name}</div><div class="remove-ring">×</div>`;
  wrap.onclick = () => removeFromStage(id);
  activeZone.appendChild(wrap);

  spawnSparkles(wrap);
  if (activeSet.size === 1) startSeq();
  updateTrayState(id, true);
  updateFireMeter();
}

function removeFromStage(id) {
  activeSet.delete(id);
  const el = document.getElementById('stage-' + id);
  if (el) {
    el.style.animation = 'popIn .25s cubic-bezier(.34,1.56,.64,1) reverse forwards';
    setTimeout(() => el.remove(), 230);
  }
  if (activeSet.size === 0) {
    stopSeq();
    hint.style.display = '';
  }
  updateTrayState(id, false);
  updateFireMeter();
}

function updateTrayState(id, on) {
  const el = document.getElementById('tray-' + id);
  if (el) el.classList.toggle('on', on);
}

// ── TRAY ──────────────────────────────────────────────────────────────────────
const charRow = document.getElementById('char-row');
for (const [id, c] of Object.entries(CHARS)) {
  const wrap = document.createElement('div');
  wrap.className = 'tray-char';
  wrap.id = 'tray-' + id;
  wrap.innerHTML = c.svg(56) + `<div class="tray-label">${c.name}</div>`;
  wrap.onclick = () => { initAudio(); addToStage(id); };
  charRow.appendChild(wrap);
}

// ── SPARKLES ──────────────────────────────────────────────────────────────────
function spawnSparkles(el) {
  const rect = el.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const colors = ['#ff6fa3','#ffcc00','#a78bfa','#4fc3f7','#ff8c00','#fff'];
  for (let i = 0; i < 10; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    const size = 5 + Math.random() * 8;
    const angle = Math.random() * Math.PI * 2;
    const dist = 30 + Math.random() * 50;
    s.style.cssText = `
      width:${size}px;height:${size}px;
      left:${cx - size/2}px;top:${cy - size/2}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      --dx:${Math.cos(angle)*dist}px;
      --dy:${Math.sin(angle)*dist}px;
      animation-duration:${0.4+Math.random()*.4}s;
      animation-delay:${Math.random()*.1}s;
      z-index:999;
    `;
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 800);
  }
}
</script>
